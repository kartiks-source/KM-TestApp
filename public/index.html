<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock-out Watch · Catalys</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#overview" aria-label="Stock-out Watch home">
        <img src="/favicon.svg" alt="" width="30" height="30">
        <span><b>Stock-out Watch</b><small id="store-name">Catalys</small></span>
      </a>
      <nav class="tabs" id="tabs" aria-label="Sections">
        <a href="#overview" data-view="overview">Overview</a>
        <a href="#reorder" data-view="reorder">Reorder <em id="n-reorder"></em></a>
        <a href="#stockouts" data-view="stockouts">Stock-outs <em id="n-stockouts"></em></a>
        <a href="#products" data-view="products">Products</a>
        <a href="#data" data-view="data">Data &amp; settings</a>
      </nav>
      <div class="range" role="group" aria-label="Period">
        <button data-days="7">7 d</button><button data-days="14">14 d</button><button data-days="30" class="on">30 d</button><button data-days="60">60 d</button>
      </div>
    </div>
    <div class="source" id="source"></div>
  </header>

  <main id="view" class="wrap" aria-live="polite"><p class="muted pad">Loading…</p></main>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-card" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button class="x" id="drawer-close" aria-label="Close">×</button>
      <div id="drawer-body"></div>
    </div>
  </aside>
  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
